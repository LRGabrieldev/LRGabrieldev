<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="João Gabriel Loureiro — Vision Orbital Tech">
  <defs>
    <clipPath id="cardClip">
      <rect width="1200" height="320" rx="18"/>
    </clipPath>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="52%" stop-color="#090A10"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>

    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D83831"/>
      <stop offset="52%" stop-color="#EC511A"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>

    <linearGradient id="solarDiag" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D83831"/>
      <stop offset="50%" stop-color="#EC511A"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>

    <linearGradient id="solarTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EE4D42"/>
      <stop offset="50%" stop-color="#F76B2A"/>
      <stop offset="100%" stop-color="#FF8B2E"/>
    </linearGradient>

    <linearGradient id="votMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE0EC"/>
    </linearGradient>

    <radialGradient id="orbDiscGrad" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#14161F"/>
      <stop offset="55%" stop-color="#090A0F"/>
      <stop offset="100%" stop-color="#040406"/>
    </radialGradient>

    <radialGradient id="glowCrimson" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D83831" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#D83831" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#D83831" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#FF6B00" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D83831" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#D83831" stop-opacity="0"/>
    </radialGradient>

    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.036" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#FFFFFF" fill-opacity="0.085"/>
    </pattern>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="starGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.45); }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.96; }
      50% { opacity: 0.58; }
    }
    @keyframes haloBreath {
      0%, 100% { opacity: 0.88; }
      50% { opacity: 1; }
    }
    .pulse-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseDot 2.8s ease-in-out infinite;
    }
    .star-center {
      animation: starTwinkle 3.4s ease-in-out infinite;
    }
    .halo-group {
      animation: haloBreath 5.2s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-ring, .star-center, .halo-group { animation: none; }
    }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Obsidian / Alabaster Base + Technical Grid -->
    <rect width="1200" height="320" fill="url(#bgGrad)"/>
    <rect width="1200" height="320" fill="url(#techGrid)"/>

    <!-- Harmonious Dual-Tone Solar-Orbital Atmosphere -->
    <g class="halo-group">
      <ellipse cx="185" cy="24" rx="260" ry="130" fill="url(#glowLeft)"/>
      <circle cx="945" cy="175" r="230" fill="url(#glowCrimson)"/>
      <circle cx="1032" cy="116" r="195" fill="url(#glowOrange)"/>
    </g>

    <!-- Subtle top editorial accent bar -->
    <rect x="64" y="0" width="210" height="3" rx="1.5" fill="url(#solarGrad)"/>

    <!-- Subtle vertical separator accent -->
    <line x1="782" y1="42" x2="782" y2="278" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="3 5"/>

    <!-- LEFT COLUMN: Editorial Identity -->
    <!-- Eyebrow Pill -->
    <g transform="translate(64, 42)">
      <rect width="260" height="28" rx="14" fill="#111218" stroke="rgba(255,255,255,0.11)" stroke-width="1"/>
      <circle cx="17" cy="14" r="6" fill="url(#solarGrad)" opacity="0.24" class="pulse-ring"/>
      <circle cx="17" cy="14" r="3.4" fill="url(#solarGrad)"/>
      <text x="30" y="18" fill="#D4D6E0" font-family="'JetBrains Mono','Cascadia Code','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" letter-spacing="1.4">VISION ORBITAL TECH  ·  FOUNDER</text>
    </g>

    <!-- Main Display Name -->
    <text x="64" y="126" fill="#FAFAFA" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',Arial,sans-serif" font-size="45" font-weight="800" letter-spacing="-1.1">João Gabriel Loureiro</text>

    <!-- Role Line with Solar Accent Bar (single text element for cross-OS kerning) -->
    <rect x="64" y="152" width="26" height="3.5" rx="1.75" fill="url(#solarGrad)"/>
    <text x="102" y="160" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',Arial,sans-serif" font-size="19" letter-spacing="-0.2"><tspan fill="url(#solarTextGrad)" font-weight="700">Full Stack Developer</tspan><tspan fill="#5C6070" font-weight="400">  ·  </tspan><tspan fill="#D2D5E0" font-size="18" font-weight="500">Web Experiences &amp; Custom Systems</tspan></text>

    <!-- Value Statement -->
    <text x="64" y="198" fill="#9599AA" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="400">Clean architecture, bespoke interfaces, real-time SaaS, and smart automations.</text>

    <!-- Core Stack Chips -->
    <g transform="translate(64, 228)">
      <rect width="108" height="27" rx="7" fill="#101118" stroke="rgba(255,255,255,0.095)" stroke-width="1"/>
      <circle cx="13" cy="13.5" r="3" fill="#D83831"/>
      <text x="23" y="17.5" fill="#D8DAE4" font-family="'JetBrains Mono','Cascadia Code','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="500">TypeScript</text>
    </g>
    <g transform="translate(180, 228)">
      <rect width="138" height="27" rx="7" fill="#101118" stroke="rgba(255,255,255,0.095)" stroke-width="1"/>
      <circle cx="13" cy="13.5" r="3" fill="#E64823"/>
      <text x="23" y="17.5" fill="#D8DAE4" font-family="'JetBrains Mono','Cascadia Code','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="500">React &amp; Next.js</text>
    </g>
    <g transform="translate(326, 228)">
      <rect width="86" height="27" rx="7" fill="#101118" stroke="rgba(255,255,255,0.095)" stroke-width="1"/>
      <circle cx="13" cy="13.5" r="3" fill="#F25A14"/>
      <text x="23" y="17.5" fill="#D8DAE4" font-family="'JetBrains Mono','Cascadia Code','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="500">Node.js</text>
    </g>
    <g transform="translate(420, 228)">
      <rect width="168" height="27" rx="7" fill="#101118" stroke="rgba(255,255,255,0.095)" stroke-width="1"/>
      <circle cx="13" cy="13.5" r="3" fill="#FF6B00"/>
      <text x="23" y="17.5" fill="#D8DAE4" font-family="'JetBrains Mono','Cascadia Code','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="500">Supabase &amp; Firebase</text>
    </g>
    <g transform="translate(596, 228)">
      <rect width="140" height="27" rx="7" fill="#101118" stroke="rgba(255,255,255,0.095)" stroke-width="1"/>
      <circle cx="13" cy="13.5" r="3" fill="#D83831"/>
      <text x="23" y="17.5" fill="#D8DAE4" font-family="'JetBrains Mono','Cascadia Code','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="500">Cloudflare Edge</text>
    </g>

    <!-- Subtle Telemetry Footer -->
    <text x="64" y="290" fill="#707487" font-family="'JetBrains Mono','Cascadia Code','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="500" letter-spacing="1.0">visionorbital-tech.vercel.app   ·   @vot.tech   ·   BRAZIL</text>

    <!-- RIGHT COLUMN: Vision Orbital Tech Geometric Emblem -->
    

    <!-- Inclined Solar Orbital Trajectory Ring (back half) -->
    <ellipse cx="978" cy="160" rx="146" ry="44" transform="rotate(-18 978 160)" fill="none" stroke="url(#solarGrad)" stroke-width="1.3" stroke-opacity="0.42" stroke-dasharray="6 5"/>

    <!-- Pure Obsidian VOT Medallion Base -->
    <circle cx="972" cy="160" r="103" fill="url(#orbDiscGrad)"/>

    <!-- 5 Eccentric Concentric Orbital Crescent Rings (faithful to VOT logo) -->
    <g fill="none">
      <circle cx="972.0" cy="160.0" r="102.0" stroke="url(#solarDiag)" stroke-width="2.5" opacity="0.96"/>
      <circle cx="973.8" cy="160.8" r="100.0" stroke="#FAFAFA" stroke-width="2.0" opacity="0.92"/>
      <circle cx="975.6" cy="161.6" r="98.0" stroke="#E4E6F0" stroke-width="1.65" opacity="0.78"/>
      <circle cx="977.4" cy="162.4" r="96.0" stroke="#C8CCD8" stroke-width="1.35" opacity="0.58"/>
      <circle cx="979.2" cy="163.2" r="94.0" stroke="url(#solarGrad)" stroke-width="1.15" opacity="0.52"/>
    </g>

    <!-- Three Iconic 4-Point Sparkle Stars -->
    <g filter="url(#starGlow)">
      <!-- Left star -->
      <path d="M 936 113 Q 937.6 123.4 948 125 Q 937.6 126.6 936 137 Q 934.4 126.6 924 125 Q 934.4 123.4 936 113 Z" fill="#090A0F" stroke="#F4F5FA" stroke-width="1.35"/>
      <!-- Center star (solar flare highlight) -->
      <path class="star-center" d="M 980 109 Q 982 122.8 995 125 Q 982 127.2 980 141 Q 978 127.2 965 125 Q 978 122.8 980 109 Z" fill="url(#solarDiag)" stroke="#FFF2E8" stroke-width="1.15"/>
      <!-- Right star -->
      <path d="M 1024 113 Q 1025.6 123.4 1036 125 Q 1025.6 126.6 1024 137 Q 1022.4 126.6 1012 125 Q 1022.4 123.4 1024 113 Z" fill="#090A0F" stroke="#F4F5FA" stroke-width="1.35"/>
    </g>

    <!-- Bold Geometric VOT Vector Wordmark (100% font-independent paths) -->
    <g transform="translate(911.5, 152) scale(0.865)" fill="url(#votMetal)">
      <!-- V -->
      <path d="M 0 0 L 13.5 0 L 24 33 L 34.5 0 L 48 0 L 30.5 50 L 17.5 50 Z"/>
      <!-- O -->
      <path fill-rule="evenodd" d="M 80 -0.5 A 26.5 25.5 0 1 0 80 50.5 A 26.5 25.5 0 1 0 80 -0.5 Z M 80 10.5 A 12.5 14.5 0 1 1 80 39.5 A 12.5 14.5 0 1 1 80 10.5 Z"/>
      <!-- T -->
      <path d="M 112 0 L 158 0 L 158 11.5 L 141.75 11.5 L 141.75 50 L 128.25 50 L 128.25 11.5 L 112 11.5 Z"/>
    </g>

    <!-- Subtle caption beneath VOT inside orb -->
    <text x="980" y="216" text-anchor="middle" fill="#8B8E9B" font-family="'JetBrains Mono','Cascadia Code',ui-monospace,Consolas,monospace" font-size="8.2" font-weight="600" letter-spacing="2.4">VISION ORBITAL</text>

    <!-- Orbiting Highlight Nodes on the Solar Trajectory -->
    <circle cx="1110" cy="116" r="4.2" fill="#FF6B00" filter="url(#starGlow)"/>
    <circle cx="842" cy="204" r="3.2" fill="#D83831" filter="url(#starGlow)"/>
  </g>

  <!-- Crisp Outer Hairline Border -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="17.5" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
</svg>
